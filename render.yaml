services:
  - type: web
    name: etinar-sst-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: etinar-sst-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://etinar-sst-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
